<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a3e635" />
    <title>Acortador de URLs | roly.top</title>
    <meta name="description" content="Acorta tus URLs de forma rápida y gratuita. Genera códigos QR, obtén estadísticas y gestiona tus enlaces cortos con roly.top." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="roly.top" />

    <!-- Preconnect critical origins -->
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    
    <!-- Preload critical fonts (only above-the-fold weights) -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Syne-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Critical CSS inline for above-the-fold content -->
    <style>
      /* Critical CSS - render path optimization */
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      :root{--background:#ebebef;--foreground:#09090b;--card:#f5f5f7;--primary:#65a30d;--primary-foreground:#fff;--border:rgba(132,204,22,.2);--muted:#d8d8dc;--muted-foreground:#71717a;--font-display:"Syne",Georgia,serif;--font-body:"Inter",ui-sans-serif,system-ui,sans-serif;--font-mono:"Space Mono",ui-monospace,monospace}
      .dark{--background:#060606;--foreground:#f4f4f5;--card:#0e0e10;--primary:#a3e635;--primary-foreground:#09090b;--border:rgba(163,230,53,.14);--muted:#151517;--muted-foreground:#a1a1aa}
      body{font-family:var(--font-body),ui-sans-serif,system-ui,sans-serif;background:var(--background);color:var(--foreground);min-height:100vh}
      .font-display{font-family:var(--font-display),var(--font-body),sans-serif}
      /* Prevent layout shift from font loading */
      .font-display,.font-mono{visibility:visible}
      @font-face{font-family:"Inter";src:url("/fonts/Inter-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
      @font-face{font-family:"Inter";src:url("/fonts/Inter-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
      @font-face{font-family:"Syne";src:url("/fonts/Syne-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
      /* Hero section initial render */
      .hero-section{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem 3.5rem;position:relative;overflow:hidden}
      .shortener-card{width:100%;max-width:640px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;z-index:1;box-shadow:0 0 0 1px var(--border),0 24px 60px rgba(0,0,0,.5)}
    </style>

    <!-- Canonical -->
    <link rel="canonical" href="https://roly.top" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Acortador de URLs | roly.top" />
    <meta property="og:description" content="Acorta tus URLs de forma rápida y gratuita. Genera códigos QR, obtén estadísticas y gestiona tus enlaces cortos." />
    <meta property="og:url" content="https://roly.top" />
    <meta property="og:image" content="https://roly.top/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="roly.top - Acortador de URLs rápido y gratuito con código QR y estadísticas" />
    <meta property="og:site_name" content="roly.top" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@rolytop" />
    <meta name="twitter:title" content="Acortador de URLs | roly.top" />
    <meta name="twitter:description" content="Acorta tus URLs de forma rápida y gratuita. Genera códigos QR, obtén estadísticas y gestiona tus enlaces cortos." />
    <meta name="twitter:image" content="https://roly.top/og-image.png" />
    <meta name="twitter:image:alt" content="roly.top - Acortador de URLs rápido y gratuito con código QR y estadísticas" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "roly.top",
      "url": "https://roly.top",
      "description": "Acorta tus URLs de forma rápida y gratuita. Genera códigos QR, obtén estadísticas y gestiona tus enlaces cortos con roly.top.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "roldyoran"
      }
    }
    </script>

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
