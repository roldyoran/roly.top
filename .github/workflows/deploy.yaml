name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint check
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Backend tests
        run: bun run test:back

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build:front
        env:
          VITE_APP_BASE_URL: ${{ secrets.VITE_APP_BASE_URL }}

  deploy:
    name: Deploy
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure D1 binding and secrets
        run: |
          cp backend/wrangler.example.jsonc backend/wrangler.jsonc
          sed -i "s|YOUR_DATABASE_NAME|${{ secrets.CLOUDFLARE_D1_DATABASES_NAME }}|g" backend/wrangler.jsonc
          sed -i "s|YOUR_DATABASE_ID|${{ secrets.CLOUDFLARE_DATABASE_ID }}|g" backend/wrangler.jsonc
          sed -i "s|YOUR_BETTER_AUTH_SECRET|${{ secrets.BETTER_AUTH_SECRET }}|g" backend/wrangler.jsonc
          sed -i "s|YOUR_BETTER_AUTH_URL|${{ secrets.BETTER_AUTH_URL }}|g" backend/wrangler.jsonc
          sed -i "s|YOUR_GOOGLE_CLIENT_ID|${{ secrets.GOOGLE_CLIENT_ID }}|g" backend/wrangler.jsonc
          sed -i "s|YOUR_GOOGLE_CLIENT_SECRET|${{ secrets.GOOGLE_CLIENT_SECRET }}|g" backend/wrangler.jsonc
          sed -i "s|YOUR_SERVICE_ADMIN_API_KEY|${{ secrets.SERVICE_ADMIN_API_KEY }}|g" backend/wrangler.jsonc
          sed -i "s|YOUR_TRUSTED_ORIGINS|${{ secrets.TRUSTED_ORIGINS }}|g" backend/wrangler.jsonc

      - name: Deploy to Cloudflare
        run: |
          bunx wrangler deploy \
            --config backend/wrangler.jsonc \
            --x-autoconfig false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
